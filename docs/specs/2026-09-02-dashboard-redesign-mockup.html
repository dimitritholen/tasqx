  :root {

    --fg:      #d8dee9;
    --accent:  #88c0d0;  /* accent            */
    --muted:   #4c566a;  /* muted             */

    --danger:  #bf616a;  /* overdue, priority.H */
    --green:   #a3be8c;  /* timer.active, urgency cold */

  html,body { margin:0; height:100%; background:#242933; color:var(--fg);
              font-family:'JetBrains Mono','Cascadia Code','Fira Code',monospace; }
  #bar { padding:6px 10px; font-size:12px; color:var(--muted); background:#1d212b;
         display:flex; gap:6px; flex-wrap:wrap; align-items:center; }
  #bar b { color:var(--fg); font-weight:normal; margin-right:6px; }
  #bar button { background:#2e3440; color:var(--fg); border:1px solid var(--muted);
                font:inherit; padding:2px 8px; cursor:pointer; border-radius:3px; }
  #bar button:hover { border-color:var(--accent); color:var(--accent); }
  #wrap { display:flex; align-items:center; justify-content:center;
          height:calc(100% - 34px); overflow:hidden; }
  #term { background:var(--bg); line-height:1.25; white-space:pre; padding:.4em .6em;
          border-radius:4px; box-shadow:0 0 40px rgba(0,0,0,.5); }
  .fg      { color:var(--fg); }
  .muted   { color:var(--muted); }
  .accent  { color:var(--accent); }
  .accentB { color:var(--accent); font-weight:bold; }
  .header  { color:var(--accent); font-weight:bold; }
  .project { color:var(--project); }
  .group   { color:var(--project); font-weight:bold; }
  .tag     { color:var(--tag); }
  .overdue { color:var(--danger); font-weight:bold; }
  .priH    { color:var(--danger); font-weight:bold; }
  .priM    { color:var(--warn); }
  .priL    { color:var(--muted); }
  .timer   { color:var(--green); }
  .urgHot  { color:var(--danger); }
  .urgWarm { color:var(--warn); }
  .urgCold { color:var(--green); }
  .chip    { background:#3b4252; color:var(--fg); }
  .chipK   { background:#3b4252; color:var(--accent); }
  .match   { color:var(--accent); font-weight:bold; text-decoration:underline; }
  .ideal   { color:var(--muted); }
  .scope   { color:var(--warn); }
  .cursor  { background:#3b4252; }
  .cursorA { background:#3b4252; color:var(--accent); font-weight:bold; }
  .confirm { color:var(--green); font-weight:bold; }
  .dim     { color:#616e88; }

  query: "",                 // search input
  filterInput: "",
  confirm: null,             // one-line confirmation after an action
  pendingKey: null,          // e.g. "p" waiting for H/M/L
};

/* ── grid ─────────────────────────────────────────────────────────────── */
let grid;
function clearGrid(){ grid = Array.from({length:H},()=>Array.from({length:W},()=>({ch:" ",cls:"fg"}))); }
function put(y,x,text,cls){
  cls = cls || "fg";
  for (let i=0;i<text.length;i++){
    const xx=x+i; if(xx<0||xx>=W||y<0||y>=H) continue;
    grid[y][xx]={ch:text[i],cls};
  }
}
function hline(y,x1,x2,cls){ for(let x=x1;x<=x2;x++) grid[y][x]={ch:"\u2500",cls:cls||"muted"}; }
function fillBg(y,x1,x2,cls){ for(let x=x1;x<=x2;x++){ grid[y][x].cls = cls; } }

/* ── data helpers ─────────────────────────────────────────────────────── */
const PROJECTS = DATA.projects;
function scopeList(){ return ["all"].concat(PROJECTS.map(p=>p.name)); }
function moveScope(dir){
  const l=scopeList(); let i=l.indexOf(S.scope);
  i=(i+dir+l.length)%l.length; S.scope=l[i]; S.cursor=0;
}
function parseFilter(tok){
  let m;
  if ((m=tok.match(/^status:(\w+)$/)))  return t=>true; // open snapshot is pending-only; kept for grammar
  if ((m=tok.match(/^pri:([HML])$/)))   return t=>t.pri===m[1];
  if ((m=tok.match(/^tag:([\w-]+)$/)))  return t=>t.tags.includes(m[1]);
  if ((m=tok.match(/^due<(\d+)d$/)))    return t=>t.due!==null && t.due< +m[1];
  if ((m=tok.match(/^age>(\d+)d$/)))    return t=>t.age> +m[1];
  if (tok==="+overdue")  return t=>t.due!==null && t.due<0;
  if (tok==="+blocked")  return t=>t.blocked;
  if (tok==="+waiting")  return t=>t.wait;
  if (tok==="+timer")    return t=>t.timer;
  return null;
}
function visibleTasks(){
  let rows = DATA.tasks;
  if (S.scope!=="all") rows = rows.filter(t=>t.project===S.scope);
  for (const f of S.filters){ const p=parseFilter(f); if(p) rows=rows.filter(p); }
  return rows;
}
/* rows interleaved with group headers when scope=all */
function taskRows(){
  const rows = visibleTasks();
  if (S.scope!=="all") return rows.map(t=>({t}));
  const out=[]; const by={};
  for (const t of rows) (by[t.project]=by[t.project]||[]).push(t);
  for (const p of PROJECTS.map(p=>p.name)){
    if (!by[p]) continue;
    out.push({group:p, n:by[p].length, ov:by[p].filter(t=>t.due!==null&&t.due<0).length});
    for (const t of by[p]) out.push({t});
  }
  return out;
}
function cursorTask(){
  const rows=taskRows().filter(r=>r.t);
  return rows[Math.min(S.cursor, rows.length-1)] ? rows[Math.min(S.cursor,rows.length-1)].t : null;
}
function fuzzy(q, s){          // subsequence match → matched index list or null
  q=q.toLowerCase(); s=s.toLowerCase();
  const idx=[]; let j=0;
  for (let i=0;i<q.length;i++){
    j=s.indexOf(q[i], j); if(j<0) return null; idx.push(j); j++;
  }
  return idx;
}
function searchResults(){
  if (!S.query) return [];
  const out=[];
  for (const t of DATA.tasks){
    let m=fuzzy(S.query, t.title);
    if (m) { out.push({kind:"title", t, text:t.title, idx:m}); continue; }
    for (const tg of t.tags){ m=fuzzy(S.query, tg); if(m){ out.push({kind:"tag", t, text:"+"+tg, idx:m.map(i=>i+1)}); break; } }
    if (out.length && out[out.length-1].t===t) continue;
    m=fuzzy(S.query, t.project); if(m) out.push({kind:"project", t, text:t.project, idx:m});
  }
  for (const h of DATA.mem){
    const m=fuzzy(S.query, h.title+" "+h.snippet);
    if (m) out.push({kind:"memory", mem:h, text:h.snippet.replace(/\u2026/g,"…"), idx:[]});
  }
  return out.slice(0,12);
}
function hums(h){ if(h<=0) return "0h"; const hh=Math.floor(h), mm=Math.round((h-hh)*60);
  return mm? hh+"h"+String(mm).padStart(2,"0") : hh+"h"; }
function urgCls(u){ return u>=9? "urgHot" : u>=4? "urgWarm" : "urgCold"; }
function fit(s,n){ s=String(s); return s.length>n ? s.slice(0,n-1)+"\u2026" : s.padEnd(n); }

/* ── layout constants ─────────────────────────────────────────────────── */
const LX=1, LW=28, SEP=29, RX=30, RW=89;      // left col, separator, right region
const R_PROJ=1, R_PULSE=14, R_EFF=26;         // left rules
const R_TASK=1, R_BURN=28, R_BOT=38, R_FOOT=39;

/* ── render ───────────────────────────────────────────────────────────── */
function render(){
  clearGrid();
  drawFrame();
  drawHeader();
  drawProjects();
  drawPulse();
  drawEffort();
  drawTasks();
  drawBurndown();
  drawFooter();
  if (S.overlay==="help")   drawHelp();
  if (S.overlay==="detail") drawDetail();
  if (S.overlay==="search") drawSearch();
  if (S.overlay==="filter") drawFilterBar();
  paint();
}
function drawFrame(){
  put(0,0,"\u250c","muted"); put(0,W-1,"\u2510","muted"); hline(0,1,W-2);
  put(R_BOT,0,"\u2514","muted"); put(R_BOT,W-1,"\u2518","muted"); hline(R_BOT,1,W-2);
  for(let y=1;y<R_BOT;y++){ put(y,0,"\u2502","muted"); put(y,W-1,"\u2502","muted"); put(y,SEP,"\u2502","muted"); }
  put(R_BOT,SEP,"\u2534","muted");
  // rules
  rule(R_PROJ, 0, SEP, "1", "PROJECTS", S.panel===1);
  rule(R_PULSE,0, SEP, "4", "PULSE",    S.panel===4);
  rule(R_EFF,  0, SEP, "5", "EFFORT",   S.panel===5);
  put(R_PROJ,SEP,"\u252c","muted"); put(R_PULSE,SEP,"\u2524","muted"); put(R_EFF,SEP,"\u2524","muted");
  ruleRight(R_TASK); ruleBurn();
}
function rule(y,x1,x2,num,title,focused){
  hline(y,x1+1,x2-1); put(y,x1,"\u251c","muted");
  const label = "\u2500"+num+"\u2500 "+(focused?"\u25b8 ":"")+title+" ";
  put(y,x1+1,label, focused?"accentB":"header");
}
function ruleRight(y){
  hline(y,SEP+1,W-2); put(y,W-1,"\u2524","muted");
  const focused = S.panel===2;
  let label="\u25002\u2500 "+(focused?"\u25b8 ":"")+"TASKS \u2500 "+S.scope+" ";
  put(y,SEP+1,label, focused?"accentB":"header");
  let x=SEP+1+label.length+1;
  if (S.filters.length){
    for(const f of S.filters){
      const chip=" "+f+" ";
      put(y,x,chip,"chip"); x+=chip.length+1;
    }
    put(y,x," F clears ","dim"); x+=10;
  } else {
    put(y,x," f filter \u00b7 / search ","dim"); x+=22;
  }
}
function ruleBurn(){
  const y=R_BURN;
  hline(y,SEP+1,W-2); put(y,SEP,"\u251c","muted"); put(y,W-1,"\u2524","muted");
  const focused=S.panel===3;
  let label="\u25003\u2500 "+(focused?"\u25b8 ":"")+"BURNDOWN ";
  put(y,SEP+1,label,focused?"accentB":"header");
  let x=SEP+1+label.length+1;
  for (const w of ["week","14d","30d"]){
    put(y,x,w, w===S.window?"accentB":"dim"); x+=w.length+2;
  }
  put(y,x,"\u2500 \u2500\u2500 remaining  \u00b7\u00b7 ideal  \u2500\u2500 scope added","dim");
}
function drawHeader(){
  // right-hand counts first, so the strip knows its budget
  const rows=visibleTasks();
  const ov=rows.filter(t=>t.due!==null&&t.due<0).length;
  const bl=rows.filter(t=>t.blocked).length;
  const timer = DATA.tasks.find(t=>t.timer);
  const right = " "+rows.length+" open \u00b7 "+ov+" overdue \u00b7 "+bl+" blocked \u00b7 "
    + DATA.stats.done7+" done/wk \u00b7 "+(timer? "\u25b6 #"+timer.id : "no timer")+" ";
  const budget = W-3-right.length;   // strip may not cross into the counts
  let x=2; put(0,x," tasqx ","header"); x+=8;
  // scope strip: all + neighbours of the active scope, active in accent
  const l=scopeList(); const ai=l.indexOf(S.scope);
  let shown = l.slice(Math.max(0,ai-1), ai+2).map(n=>({n, cur:n===S.scope}));
  if (shown[0].n!=="all") shown=[{n:"all",cur:false}].concat(shown.filter(s=>s.n!=="all"));
  if (ai>1){ put(0,x,"\u2039 ","muted"); x+=2; }
  for (const s of shown){
    const t=" "+s.n+" ";
    if (x+t.length>budget-5) break;
    put(0,x,t, s.cur?"accentB":"dim"); x+=t.length+1;
  }
  const hidden=l.length-1-ai;
  if (hidden>1 && x+5<=budget){ put(0,x,"\u203a +"+(hidden-1)+" ","muted"); }
  put(0, W-2-right.length, right, "dim");
  if (ov) { const p=right.indexOf(ov+" overdue"); put(0,W-2-right.length+p, ov+" overdue", "overdue"); }
}
function drawProjects(){
  const l=scopeList(); let y=R_PROJ+1;
  for (const name of l){
    if (y>=R_PULSE) break;
    const cur = name===S.scope;
    const p = PROJECTS.find(p=>p.name===name);
    const open = p? p.open : DATA.tasks.length;
    const mark = cur? "\u25b8" : (p&&p.default? "*" : " ");
    put(y,LX," "+mark+" ", cur?"accentB":"muted");
    put(y,LX+3, fit(name,17), cur?"accentB": name==="all"?"fg":"project");
    put(y,LX+21, String(open).padStart(3), cur?"accentB":"fg");
    if (p && p.overdue) put(y,LX+25,"\u25cf","overdue");
    if (cur) fillBg(y,LX,SEP-1, y===y?grid[y][LX].cls:"cursor");
    y++;
  }
}
function cyc(d){ return d>=1? d+"d" : d<=0? "<1h" : Math.max(1,Math.round(d*24))+"h"; }
function drawPulse(){

function drawEffort(){
  const s=DATA.stats; let y=R_EFF+1;
  put(y,LX+1,"est left on open work","fg");
  put(y+1,LX+1,hums(s.est_left_total)+" est \u00b7 "+hums(s.trk_total)+" tracked","accent");
  let yy=y+2;
  const ent=Object.entries(s.est_by_proj);
  for (const [p,h] of ent){

  }
  put(yy,LX+1,"".padEnd(26,"\u254c"),"muted"); yy++;

  const tp=PROJECTS.filter(p=>p.tok>0);
  for (const p of tp){
    put(yy,LX+1,fit(p.name,14),"project");
    put(yy,LX+16,(p.tok/1e6).toFixed(1)+"M","tag"); yy++;
  }
  if (yy<R_BOT-1) put(yy,LX+1,"cost/day: needs API \u2020","dim");
}
function sparkline(vals,w){
  const bars="\u2581\u2582\u2583\u2584\u2585\u2586\u2587\u2588";
  const mx=Math.max(1,...vals);
  return vals.slice(-w).map(v=>v===0?"\u2581":bars[Math.min(7,Math.ceil(v/mx*7))]).join("");
}
function drawTasks(){
  const rows=taskRows();
  const top=R_TASK+1, bottom=R_BURN-1, avail=bottom-top+1;
  const cursorRows=rows.filter(r=>r.t);
  const ci=Math.min(S.cursor,cursorRows.length-1);
  const cTask=cursorRows[ci];
  // scroll so cursor visible
  let cRowIdx=rows.indexOf(cTask);
  let start=0;
  if (cRowIdx>=avail) start=cRowIdx-avail+1;
  let y=top;
  for (let i=start;i<rows.length && y<=bottom;i++,y++){
    const r=rows[i];
    if (r.group){
      put(y,RX+1,"\u258d ","project");
      put(y,RX+3,r.group,"group");
      let info=" \u2500 "+r.n+" open"+(r.ov? " \u00b7 "+r.ov+" overdue":"");
      put(y,RX+3+r.group.length,info, r.ov?"overdue":"dim");
      continue;
    }
    const t=r.t; const isCur = r===cTask;
    if (isCur){ fillBg(y,RX,W-2,"cursor"); put(y,RX+1,"\u25b8","accentB"); }
    const base=isCur?"cursorA":"fg";
    put(y,RX+3,("#"+t.id).padStart(4), isCur?"cursorA":"dim");
    put(y,RX+8, (t.urg==null?0:t.urg).toFixed(1).padStart(4), urgCls(t.urg||0));
    put(y,RX+13, t.pri||"\u00b7", t.pri? "pri"+t.pri : "dim");
    let title=fit(t.title, 56);
    put(y,RX+15, title, base);
    let x=RX+72;
    const tg=t.tags.slice(0,2).map(x=>"+"+x).join(" ");
    put(y,RX+72, fit(tg,12), "tag");
    if (t.blocked) put(y,RX+84,"\u26d4","overdue");
    if (t.timer)   put(y,RX+84,"\u25b6","timer");
    if (t.due!==null){
      const d=t.due<0? "\u2212"+(-t.due)+"d" : t.due===0? "today" : "+"+t.due+"d";
      put(y,W-2-d.length, d, t.due<0?"overdue": t.due<3?"priM":"dim");
    }
    if (isCur){ for(let x2=RX;x2<W-1;x2++){ if(grid[y][x2].cls==="fg") grid[y][x2].cls="cursor"; } }
  }
  if (rows.length===0) put(top+1,RX+2,"no rows match \u2014 F clears the filters","dim");
}
/* A connected step-line in box-drawing glyphs with rounded corners
   (╭ ╮ ╰ ╯) — the style that reads as one line instead of scattered marks. */
function stepLine(vals, x0, x1, py, cls){
  const n=vals.length, cols=x1-x0+1;
  const rowAt=[];
  for(let c=0;c<cols;c++){
    const i=Math.round(c/(cols-1)*(n-1));
    rowAt.push(py(vals[i]));
  }
  for(let c=0;c<cols;c++){
    const x=x0+c, r=rowAt[c];
    if(c===0 || rowAt[c-1]===r){ put(r,x,"\u2500",cls); continue; }
    const pr=rowAt[c-1];
    if(r>pr){ // line drops
      put(pr,x,"\u256e",cls);
      for(let y=pr+1;y<r;y++) put(y,x,"\u2502",cls);
      put(r,x,"\u2570",cls);
    } else {  // line rises
      put(pr,x,"\u256f",cls);
      for(let y=r+1;y<pr;y++) put(y,x,"\u2502",cls);
      put(r,x,"\u256d",cls);
    }
  }
}
function drawBurndown(){
  const days = S.window==="week"?7 : S.window==="14d"?14 : 30;
  const series=DATA.burn.slice(-days);
  const x0=RX+6, x1=W-3, y0=R_BURN+1, y1=R_BOT-2;
  const rowsN=y1-y0+1;
  const rem=series.map(s=>s.rem);
  let cum=0; const scope=series.map(s=>cum+=s.added);
  const mx=Math.max(...rem, ...scope, 1);
  // axis
  put(y0,RX+1,String(mx).padStart(3),"dim");
  put(y1,RX+1,"0".padStart(3),"dim");
  for(let y=y0;y<=y1;y++) put(y,RX+5,"\u2502","muted");
  const py=v=>y1-Math.round(v/mx*(rowsN-1));
  // ideal: first remaining → 0, a dotted diagonal under everything
  const cols=x1-x0+1;
  for(let c=0;c<cols;c+=2){
    const v=rem[0]*(1-c/(cols-1));
    put(py(v),x0+c,"\u00b7","ideal");
  }
  stepLine(scope, x0, x1, py, "scope");   // cumulative added work
  stepLine(rem,   x0, x1, py, "accent");  // remaining, drawn on top
  put(y0,x1-30,"\u2500\u2500 "+rem[rem.length-1]+" remaining","accent");
  put(y0,x1-14,"\u2500\u2500 +"+scope[scope.length-1]+" added","scope");
  put(y1,x1-24,"now "+rem[rem.length-1]+" \u00b7 net +"+ (rem[rem.length-1]-rem[0]) +" over "+S.window,"dim");
}
function drawFooter(){
  const y=R_FOOT;
  if (S.confirm){ put(y,1,S.confirm.text, S.confirm.cls||"confirm"); return; }
  if (S.pendingKey==="p"){ put(y,1,"priority for #"+cursorTask().id+":  H / M / L   (esc cancels)","accent"); return; }
  if (S.pendingKey==="t"){ put(y,1,"tag #"+cursorTask().id+":  +","accent"); return; }
  if (S.pendingKey==="u"){ put(y,1,"due for #"+cursorTask().id+":  (fri, 2026-09-10, +3d \u2026)  esc cancels","accent"); return; }
  let x=1;
  const foots=KEYS.filter(k=>k.foot).sort((a,b)=>a.rank-b.rank);
  for (const k of foots){
    const [kk,...w]=k.foot.split(" ");
    put(y,x,kk,"accent"); x+=kk.length+1;
    put(y,x,w.join(" "),"dim"); x+=w.join(" ").length+3;
    if (x>W-10) break;
  }
}
/* ── overlays ─────────────────────────────────────────────────────────── */

function drawSearch(){
  const h=17,w=90,y=5,x=Math.floor((W-w)/2);
  box(y,x,h,w,"fuzzy search \u00b7 title tags project memory");
  put(y+2,x+3,"\u203a ","accent");
  put(y+2,x+5,S.query,"fg");
  put(y+2,x+5+S.query.length,"\u2588","accent");
  const res=searchResults();
  res.forEach((r,i)=>{
    const yy=y+4+i; if (yy>=y+h-1) return;
    put(yy,x+3, r.kind.padEnd(8), r.kind==="memory"?"tag":"dim");
    if (r.t){
      put(yy,x+12,("#"+r.t.id).padStart(4),"dim");
      put(yy,x+17,fit(r.t.project,18),"project");
      const tx=x+36;
      put(yy,tx,fit(r.text,w-40),"fg");
      for(const ix of r.idx){ if(ix<w-40) grid[yy][tx+ix].cls="match"; }
    } else {
      put(yy,x+12,fit(r.mem.source,9),"dim");
      put(yy,x+22,fit(r.text,w-26),"fg");
    }
  });
  if (S.query && !res.length) put(y+4,x+3,"nothing matches \u2014 esc to close","dim");
  if (!S.query) put(y+4,x+3,"type to match \u00b7 memory hits arrive from memory.search","dim");
  put(y+h-1,x+w-40," \u23ce jump to row \u00b7 esc close \u00b7 memory.search live ","dim");
}
function drawFilterBar(){
  const y=R_FOOT;
  for(let x=0;x<W;x++) grid[y][x]={ch:" ",cls:"fg"};
  put(y,1,"filter\u203a ","accent");
  put(y,9,S.filterInput,"fg");
  put(y,9+S.filterInput.length,"\u2588","accent");
  put(y,W-64,"status: pri: tag: due<Nd age>Nd +overdue +blocked +waiting +timer","dim");
}
/* ── paint grid → DOM ─────────────────────────────────────────────────── */
function paint(){
  const pre=document.getElementById("term");
  let html="";
  for (let y=0;y<H;y++){
    let run="",cls=grid[y][0].cls;
    for(let x=0;x<W;x++){
      const c=grid[y][x];
      if(c.cls!==cls){ html+=span(run,cls); run=""; cls=c.cls; }
      run+=c.ch;
    }
    html+=span(run,cls)+"\n";
  }
  pre.innerHTML=html;
}
function esc(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;"); }
function span(t,c){ return t? '<span class="'+c+'">'+esc(t)+"</span>":""; }

/* ── keys ─────────────────────────────────────────────────────────────── */
document.addEventListener("keydown", e=>{
  const k=e.key;
  if (S.overlay==="search"){
    if (k==="Escape"){ S.overlay=null; S.query=""; }
    else if (k==="Backspace") S.query=S.query.slice(0,-1);
    else if (k==="Enter"){
      const r=searchResults()[0];
      if (r&&r.t){ S.scope=r.t.project; const rows=taskRows().filter(x=>x.t);
        S.cursor=rows.findIndex(x=>x.t.id===r.t.id); if(S.cursor<0)S.cursor=0; }
      S.overlay=null; S.query="";
    }
    else if (k.length===1) S.query+=k;
    e.preventDefault(); render(); return;
  }
  if (S.overlay==="filter"){
    if (k==="Escape"){ S.overlay=null; S.filterInput=""; }
    else if (k==="Backspace") S.filterInput=S.filterInput.slice(0,-1);
    else if (k==="Enter"){ S.filters=S.filterInput.trim().split(/\s+/).filter(Boolean); S.overlay=null; S.filterInput=""; S.cursor=0; }
    else if (k.length===1) S.filterInput+=k;
    e.preventDefault(); render(); return;
  }
  if (S.overlay){ // help/detail: any key closes (s/d act from detail)
    if (S.overlay==="detail" && (k==="s"||k==="d")){ S.overlay=null; act(k); render(); return; }
    S.overlay=null; render(); return;
  }
  if (S.pendingKey==="p"){
    if ("HML".includes(k.toUpperCase()) && k.length===1){
      const t=cursorTask(); t.pri=k.toUpperCase();
      S.confirm={text:"\u2713 #"+t.id+" priority \u2192 "+t.pri+" \u00b7 task.modify sent \u00b7 u undoes"};
    }
    S.pendingKey=null; render(); return;
  }
  if (S.pendingKey){ S.pendingKey=null; render(); return; }
  S.confirm=null;
  switch(k){
    case "[": moveScope(-1); break;
    case "]": moveScope(1); break;
    case "j": case "ArrowDown": S.cursor=Math.min(S.cursor+1, taskRows().filter(r=>r.t).length-1); break;
    case "k": case "ArrowUp":   S.cursor=Math.max(S.cursor-1,0); break;
    case "g": S.cursor=0; break;
    case "G": S.cursor=taskRows().filter(r=>r.t).length-1; break;
    case "Enter": S.overlay="detail"; break;
    case "/": S.overlay="search"; S.query=""; break;
    case "f": S.overlay="filter"; S.filterInput=S.filters.join(" ")+(S.filters.length?" ":""); break;
    case "F": S.filters=[]; break;
    case "?": S.overlay="help"; break;
    case "w": S.window = S.window==="week"?"14d": S.window==="14d"?"30d":"week"; break;
    case "s": case "d": act(k); break;
    case "t": S.pendingKey="t"; break;
    case "p": S.pendingKey="p"; break;
    case "u": S.pendingKey="u"; break;
    case "Tab": S.panel=e.shiftKey? (S.panel+3)%5+1 : S.panel%5+1; e.preventDefault(); break;
    case "1": case "2": case "3": case "4": case "5": S.panel=+k; break;
    case "q": case "Escape": S.filters=[]; S.scope="all"; break;
  }
  render();
});
function act(k){
  const t=cursorTask(); if(!t) return;
  if (k==="s"){
    t.timer=!t.timer;
    S.confirm={text: t.timer? "\u25b6 started #"+t.id+"  "+fit(t.title,50).trim()+" \u00b7 task.start \u00b7 s stops"
                            : "\u23f8 stopped #"+t.id+" \u00b7 tracked this run 0m \u00b7 task.stop", cls: t.timer?"confirm":"fg"};
  }
  if (k==="d"){
    S.confirm={text:"\u2713 done #"+t.id+"  "+fit(t.title,54).trim()+" \u00b7 task.done sent \u00b7 u undoes"};
  }
}
/* ── presets for the demo bar ─────────────────────────────────────────── */
function preset(name){
  Object.assign(S,{scope:"all",cursor:0,panel:2,filters:[],overlay:null,query:"",filterInput:"",confirm:null,pendingKey:null});
  if (name==="project"){ S.scope="fin-9695"; S.panel=2; }
  if (name==="filters"){ S.filters=["pri:H","due<40d","age>14d"]; }
  if (name==="search"){ S.overlay="search"; S.query="golden"; }
  if (name==="help"){ S.overlay="help"; }
  if (name==="detail"){ S.scope="qore-architecture"; S.cursor=0; S.overlay="detail"; }
  if (name==="action"){ S.scope="fin-9695"; S.cursor=1; act("s"); }
  render(); document.getElementById("term").focus();
}
/* ── scale to fit ─────────────────────────────────────────────────────── */
function resize(){
  const wrap=document.getElementById("wrap");
  const fw=wrap.clientWidth-40, fh=wrap.clientHeight-30;
  const fs=Math.max(6, Math.min(fw/(W*0.602), fh/(H*1.25)));
  document.getElementById("term").style.fontSize=fs+"px";
}
window.addEventListener("resize",resize);
resize(); render(); document.getElementById("term").focus();
</script>
