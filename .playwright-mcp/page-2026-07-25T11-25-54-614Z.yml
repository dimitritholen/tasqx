          - checkbox "Show all 9 lines" [ref=f4e698]
          - generic [ref=f4e699]: "FIELD TEST FINDING (blocking, found before research): token attribution cannot fire for CLI-driven work. attribution.rs:492-528 builds the pending-attribution candidate set ONLY from 'done' events whose payload carries at least one of client / transcript_path / session_id. The code comment says it outright: \"A human's `tasqx done 4` has none and is never attributed.\" The CLI's `tasqx start` / `tasqx done` expose no correlation flags (checked `tasqx done -h`). Only the MCP tool schemas add them, via mcp.rs:115 with_correlation(). Net effect: driving tasqx purely through the CLI guarantees an all-zero token report, regardless of tokens.enabled or otlp.enabled. Workaround used for this field test: `tasqx api` (stdio one-shot JSON envelope, same current binary, still not MCP) to send task.done with client/session_id/transcript_path. Proposed fix: add --client/--session-id/--transcript-path (and --token-* self-report) flags to `tasqx start` and `tasqx done`, or have the CLI auto-detect CLAUDE_* / agent env vars."
          - generic [ref=f4e700] [cursor=pointer]: Show all 9 lines
        - listitem [ref=f4e701]:
          - generic [ref=f4e702]: 2026-07-25 09:46 UTC
          - checkbox "Show all 20 lines" [ref=f4e703]
          - generic [ref=f4e704]: "RESEARCH SUMMARY — two strands, and where they conflict. TIME-TRACKING CONVENTION (Toggl, Harvest, Clockify, Jira, Linear): - Three-view split is near-universal: Summary (aggregate + chart), Detailed (raw entry list), Weekly (grid). Toggl and Clockify both ship exactly these three. - Recurring charts: stacked bar over a time axis (Toggl bar chart, stackable by project/client/tag), proportional breakdown (Toggl pie), burndown + cumulative flow + velocity + throughput (Jira Scrum reports). - Universal control: a date-range selector with presets, top-left. Grouping selector next to the chart. - Evidence on what is actually used: Atlassian and practitioner guidance both say start with cycle time and burndown; CFD and velocity are for mature teams. Dashboard research (Bach et al., \"Dashboard Design Patterns\", IEEE VIS 2022 / TVCG 2023, n=144 dashboards) catalogues eight pattern groups; the practitioner literature converges on 5-7 primary KPIs per view and warns that vanity metrics (impressive totals nobody acts on) crowd out actionable ones. AI TOKEN CONVENTION (Anthropic Console/Usage API, Langfuse, LangSmith, Helicone): - Four buckets, always separate: uncached input, cached input, cache creation, output. Anthropic Usage API groups by model/workspace/service_tier over 1m/1h/1d time buckets. - Anthropic keeps USAGE and COST as two different endpoints. Cost is derived, not the same question. - Langfuse: buckets are mutually exclusive by contract; cost attributed per observation, rolled up per trace. - Cache economics: cache read = 0.1x input price, cache write = 1.25x input price. WHERE THEY CONFLICT: 1. Blending. Time reporting blends freely — hours are hours, so \"12h this week\" is a true headline. Token reporting must not blend: four buckets at 0.1x-1.25x relative price make one total meaningless. TOKEN CONVENTION WINS. tasqx already agrees in core (reports.rs:73) but violates it in the presentation layer (html.rs:273 renders one blended stat(\"AI tokens\")). 2. Time axis. Token dashboards are time-series first (bucket_width is a required-feeling param). Time-tracking reports are entity-first (per project/client/task) with time as a secondary axis. For tasqx the unit of work is the TASK, so ENTITY-FIRST WINS — tokens per task/project, with time as the secondary axis. This is also what the API supports: report.summary group_by is project|status|priority with no time axis at all. 3. Cost. Every AI tool shows currency. tasqx must NOT: it has no pricing table, no model-price feed, and prices change. Show tokens and time as the two costs; leave money out. TIME-TRACKING CONVENTION WINS (Harvest shows revenue only because the user entered rates). DECISION TAKEN (user, this session): adopt the docs.rs self-containment guard shape for html.rs — in-page #anchors and one inline <script> become legal; per-href assertion plus url(/<link>/@import bans are added. Self-containment is preserved, and net tightened."
