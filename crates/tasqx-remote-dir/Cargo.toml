[package]
name = "tasqx-remote-dir"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "A tasqx remote connector that keeps snapshots in a folder: a network share, or one Dropbox or Syncthing syncs."
keywords = ["tasqx", "sync", "task-manager"]
categories = ["command-line-utilities"]

[[bin]]
name = "tasqx-remote-dir"
path = "src/main.rs"

[dependencies]
# NOT tasqx-core, although the protocol types live there: linking it would pull
# the bundled SQLite build, the socket transport and the embedding tables into a
# program that copies files. The wire contract is a handful of JSON fields,
# spelled here with `serde_json::json!`; the conformance suite, run against this
# binary through tasqx-core's own runner, is what keeps the two in step.
serde = { workspace = true }
serde_json = { workspace = true }
# Snapshots are content-addressed by SHA-256. The lockfile already carried
# sha1_smol (via uuid's v5), but a shared folder is written by other machines
# and other people's sync clients, and SHA-1 collisions are practical to
# produce; the version a push compares against must not be forgeable.
sha2 = "0.10.9"

[dev-dependencies]
# The version is required, not decoration: deny.toml refuses a wildcard, and a
# bare path dependency is one. scripts/bump-version.sh moves it with the rest.
tasqx-core = { path = "../tasqx-core", version = "0.14.0", features = ["conformance"] }
