[package]
name = "tasqx-cli"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "The tasqx command-line client — a thin surface over tasqx-core's JSON API."

[[bin]]
name = "tasqx"
path = "src/main.rs"

[dependencies]
tasqx-core = { path = "../tasqx-core" }
serde_json = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
ctrlc = "3.5"
directories = "6.0.0"
jiff = "0.2.32"
toml = "1.1.3"
