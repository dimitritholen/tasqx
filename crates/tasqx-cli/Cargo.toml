[package]
name = "tasqx-cli"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "The tasqx command-line client — a thin surface over tasqx-core's JSON API."
# See the note in crates/tasqx-core/Cargo.toml: keywords and categories describe
# the crate, not the workspace, and this one is the binary half.
keywords = ["task", "todo", "cli", "task-manager", "productivity"]
categories = ["command-line-utilities"]

[[bin]]
name = "tasqx"
path = "src/main.rs"

[dependencies]
tasqx-core = { path = "../tasqx-core", version = "0.2.0" }
serde_json = { workspace = true }
clap = { version = "4.6.1", features = ["derive"] }
# PINNED EXACTLY, and the `=` is the guard, not a style choice.
#
# `unstable-dynamic` is semver-EXEMPT: clap_complete's own docs say the API
# behind it may change in a patch release, so cargo's ordinary `^` compatibility
# rules protect nothing here — a `cargo update` could swap the surface out from
# under `src/complete.rs` with no version bump anyone would notice. The pin turns
# that from a silently shipped regression into a deliberate act: moving this
# number is a change with tests attached (`tests/completion.rs` drives real
# registration output through the real binary, which is what fails when upstream
# changes the template or the engine).
#
# Chosen over static `clap_complete::aot` generation, which IS stable API,
# because every value this feature exists to supply — the user's projects, tags
# and open task ids — is knowable only at Tab time. See
# docs/specs/2026-08-01-shell-completion-design.md for the two rejected
# alternatives and why five hand-maintained shell scripts is the same drift shape
# this repo has been bitten by before.
#
# It does NOT raise the measured MSRV: clap_complete 4.6.7 declares
# rust-version 1.85, well under the workspace's 1.95 floor. `unstable-dynamic`
# turns on `clap/unstable-ext` itself, so the `clap` line above needs no change
# for `#[arg(add = ...)]` to work.
clap_complete = { version = "=4.6.7", features = ["unstable-dynamic"] }
ctrlc = "3.5"
directories = "6.0.0"
jiff = { workspace = true }
toml = "1.1.3"
# Format-preserving TOML editing. A `toml::Table` round trip drops every
# comment and reorders sections, which is data loss in a file the user
# hand-edits. This is the crate cargo uses to edit Cargo.toml.
toml_edit = "0.22"
# The interactive layer (D26). Only `config edit` uses it today; `tasqx pick`
# is meant to sit on the same foundation. `crossterm` is NOT a separate
# dependency: ratatui re-exports the exact version it was built against as
# `ratatui::crossterm`, so raw mode and the alt screen cannot drift out of sync
# with the backend that draws into them.
ratatui = { version = "0.30.2", default-features = false, features = ["crossterm", "layout-cache"] }
# A terminal table is a grid of CELLS, not of chars: a CJK ideograph and most
# emoji occupy two cells, a combining mark occupies none, and an emoji ZWJ
# sequence is several chars occupying two. `format!("{s:<36}")` counts chars, so
# any of those shifted every column to its right. These two crates are NOT new
# to the dependency graph — `ratatui-core` already builds both, so this only
# names dependencies cargo was compiling anyway. `unicode-width` answers "how
# many cells"; `unicode-truncate` cuts on a grapheme boundary so a cluster is
# never sliced in half (its own algorithm, rather than a fourth hand-rolled copy
# of the grapheme walk this project would then have to maintain).
unicode-truncate = "2.0.1"
# tests/regressions.rs also names this one directly: the end-to-end alignment
# guard measures the REAL binary's output in cells, and `render::width` is
# private besides — reusing it would make the guard agree with the
# implementation by construction, so a table misaligned by a wrong width
# function would look aligned to a test that asked the same function. It needs
# no `[dev-dependencies]` twin: cargo makes a regular dependency available to
# the package's own test, example and bench targets, so the duplicate entry that
# used to sit below was a third declaration site that could drift on its own.
unicode-width = "0.2.2"
