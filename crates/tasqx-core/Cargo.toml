[package]
name = "tasqx-core"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
homepage.workspace = true
readme.workspace = true
description = "The engine behind tasqx, the organiser for your AI: SQLite storage, domain model, and the stable JSON API dispatch layer."
# Per-crate rather than inherited: these describe the CRATE, and the two members
# are different things on crates.io — a headless library and a binary. Category
# slugs are a closed vocabulary, so they cannot be invented here.
keywords = ["task", "todo", "sqlite", "task-manager", "productivity"]
categories = ["database", "data-structures"]

[features]
# OFF BY DEFAULT, deliberately (DESIGN.md §9). `notify-rust` pulls WinRT in on
# Windows and a visual toast is not headlessly verifiable, so it must not sit in
# the default build's dependency graph or its test surface. The `Notifier` trait
# and the log backend are always compiled; this only adds the OS backend.
notify-os = ["dep:notify-rust"]

[dependencies]
interprocess = "2.2"
jiff = { workspace = true }
notify-rust = { version = "4", optional = true }
rusqlite = { version = "0.40.1", features = ["bundled"] }
serde = { workspace = true }
serde_json = { workspace = true }
# D146's box card is a fixed-width grid, and a grid is made of CELLS: a CJK
# ideograph and most emoji occupy two, a combining mark occupies none. `len()`
# counts bytes and `chars().count()` counts neither, so either one leaves a
# border in the wrong column for any title that is not plain ASCII. Not new to
# the dependency graph — `crates/tasqx-cli` already builds this exact version
# for the same reason — so the lockfile gains nothing by naming it here too.
unicode-width = "0.2.2"
uuid = { version = "1.23.5", features = ["v7", "v5"] }

[target.'cfg(windows)'.dependencies]
# Interprocess exposes no named-pipe I/O timeouts. CancelIoEx lets the bounded
# connection watchdog interrupt blocking reads/writes on shutdown or deadline.
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_IO"] }

[target.'cfg(unix)'.dependencies]
# `libc::sockaddr_un` gives the platform's real `sun_path` capacity (108 on
# Linux, 104 on the BSDs/macOS) so `bind`'s length check agrees with the
# kernel it is about to ask, rather than guessing a single number that would
# be wrong on half of CI's three OSes (#236.3).
libc = "0.2"
