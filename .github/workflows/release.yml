name: Release

# Prebuilt binaries are the difference between "install Rust, clone, build" and
# "download, unpack, run" — for a task manager the first one loses most of the
# audience at hello. A tag push builds all four targets, runs the full suite on
# every platform that can run it natively, and attaches the archives to a
# GitHub release. No tag, no release: workflow_dispatch builds the same
# artifacts for inspection but publishes nothing, so the pipeline can be
# rehearsed without minting a version.
on:
  push:
    tags: ['v*']
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

permissions:
  contents: write # gh release create needs it; every other job only reads

jobs:
  # The archives are named from the TAG but the binary reports CARGO.TOML —
  # two sources for one version number, and nothing else compares them. Tag
  # v0.2.0 on a tree whose Cargo.toml still says 0.1.0 and the pipeline would
  # happily publish a tasqx-v0.2.0 archive whose binary answers `--version`
  # with 0.1.0. This job makes that a red run in the first seconds instead of
  # a mislabeled release after three platform builds. Releasing stays manual
  # (bump, commit, tag); only forgetting the bump became impossible.
  version-guard:
    name: tag matches Cargo.toml
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo metadata rather than grepping the TOML: the workspace root also
      # holds dependency `version =` lines, and a grep that happens to match
      # the right one is drift bait. Both cargo and jq are preinstalled.
      - name: Compare
        run: |
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            echo "dispatch run, no tag to check"
            exit 0
          fi
          TAG_VERSION="${GITHUB_REF_NAME#v}"
          CARGO_VERSION="$(cargo metadata --no-deps --format-version 1 \
            | jq -r '.packages[] | select(.name == "tasqx-cli") | .version')"
          if [ "$TAG_VERSION" != "$CARGO_VERSION" ]; then
            echo "::error::tag ${GITHUB_REF_NAME} says ${TAG_VERSION}, but Cargo.toml says ${CARGO_VERSION} — bump [workspace.package] version and re-tag"
            exit 1
          fi
          echo "tag ${GITHUB_REF_NAME} == Cargo.toml ${CARGO_VERSION}"

  build:
    name: build (${{ matrix.target }})
    needs: version-guard
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            test: true
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            test: true
          - os: macos-latest
            target: aarch64-apple-darwin
            test: true
          # Cross-compiled on the arm64 runner; the binary is not executed
          # there, so this entry is build-only. Intel Macs get a binary that
          # compiled but whose tests ran only on the other three targets —
          # stated here rather than hidden, the same honesty rule as the
          # "macOS is built but not in the CI test matrix" line in the README.
          - os: macos-latest
            target: x86_64-apple-darwin
            test: false
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - uses: Swatinem/rust-cache@v2

      # A release build that skipped the suite would happily ship a binary the
      # next `git push` would have turned red. Same flags as ci.yml's test job:
      # --no-fail-fast so one broken binary can't hide the rest, -D warnings
      # because a warning here is a warning there.
      - name: Test
        if: matrix.test
        run: cargo test --workspace --all-targets --no-fail-fast
        env:
          RUSTFLAGS: -D warnings

      - name: Build
        run: cargo build --release -p tasqx-cli --target ${{ matrix.target }}

      # An archive holding only a binary makes Tab completion something the user
      # has to go and find; `completions/` is the half a packager (or a person
      # with a `~/.bashrc`) can act on without running anything (D57).
      #
      # What ships is the ACTIVATION LINE — `tasqx completions <shell>` — and not
      # the registration script `TASQX_COMPLETE=<shell> tasqx` prints. The
      # registration embeds `current_exe()`, so a copy generated here would name
      # a path on this runner (`/home/runner/work/…/target/…/tasqx`) and be dead
      # on arrival everywhere else. The activation line invokes `tasqx` by name
      # off `$PATH`, which is the only form that survives being moved.
      #
      # The binary that prints them is chosen by TRYING the one just built rather
      # than by reading `matrix.test`: the cross-compiled entry cannot execute
      # here, and a runtime probe stays right if the matrix changes. The text is
      # target-independent — five `const` strings of shell source, no machine
      # code — so a host build answers for the cross-compiled archive.
      - name: Completion snippets
        shell: bash
        run: |
          set -euo pipefail
          BIN="target/${{ matrix.target }}/release/tasqx"
          if [ "${{ runner.os }}" = "Windows" ]; then BIN="$BIN.exe"; fi
          if ! "$BIN" --version >/dev/null 2>&1; then
            cargo build --release -p tasqx-cli
            BIN="target/release/tasqx"
          fi
          mkdir -p completions
          for shell in bash elvish fish powershell zsh; do
            "$BIN" completions "$shell" > "completions/tasqx.$shell"
          done
          # No table of destinations here on purpose: install.rs already holds
          # one, per shell, and a second copy in a release script is the drift
          # D30 rules against. Point at the command that reads the real one.
          cat > completions/README.md <<'EOF'
          # Tab completion

          One line per shell. The command that knows where each of them goes —
          and that will put it there, after showing you the block and asking —
          is:

              tasqx completions --install

          Run `tasqx completions <shell>` to print the line for any shell
          without installing it, and `tasqx manual completion` for the rest:
          what a Tab press reads, why the variable is `TASQX_COMPLETE`, and
          which shells are gaps rather than oversights.
          EOF

      # Archive name: tasqx-<tag>-<target>.{tar.gz,zip}. The version comes from
      # the ref so the filename can never disagree with the tag that built it;
      # a dispatch run (no tag) stamps the short SHA instead.
      - name: Package (unix)
        if: runner.os != 'Windows'
        run: |
          VERSION="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then VERSION="$(git rev-parse --short HEAD)"; fi
          STAGE="tasqx-${VERSION}-${{ matrix.target }}"
          mkdir "$STAGE"
          cp "target/${{ matrix.target }}/release/tasqx" "$STAGE/"
          cp README.md LICENSE.md "$STAGE/"
          cp -R completions "$STAGE/"
          tar czf "$STAGE.tar.gz" "$STAGE"
          shasum -a 256 "$STAGE.tar.gz" > "$STAGE.tar.gz.sha256"
      - name: Package (windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $version = $env:GITHUB_REF_NAME
          if ($env:GITHUB_REF_TYPE -ne 'tag') { $version = (git rev-parse --short HEAD) }
          $stage = "tasqx-$version-${{ matrix.target }}"
          New-Item -ItemType Directory $stage | Out-Null
          Copy-Item "target/${{ matrix.target }}/release/tasqx.exe" $stage
          Copy-Item README.md, LICENSE.md $stage
          Copy-Item completions $stage -Recurse
          Compress-Archive -Path $stage -DestinationPath "$stage.zip"
          (Get-FileHash "$stage.zip" -Algorithm SHA256).Hash.ToLower() + "  $stage.zip" | Set-Content "$stage.zip.sha256"

      - uses: actions/upload-artifact@v4
        with:
          name: tasqx-${{ matrix.target }}
          path: |
            tasqx-*.tar.gz*
            tasqx-*.zip*
          if-no-files-found: error

  # Publishing is done with the preinstalled `gh` CLI rather than a release
  # action — the same reasoning the mutants job applies to cargo-mutants: one
  # fewer third-party action holding a write-scoped token.
  release:
    name: publish release
    if: github.ref_type == 'tag'
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      # --verify-tag refuses to invent a release for a tag the repo does not
      # have; --generate-notes seeds the body from the commit log, which the
      # tagger can edit afterwards. Draft-free on purpose: if the suite and
      # four builds passed, the release IS ready, and a draft step that a
      # human must remember to click is where releases go to be forgotten.
      #
      # The two bootstrap scripts ride along as assets. The URL the README
      # shows is the one on `main`, which moves under anybody who pins it;
      # attaching the same bytes to the tag gives a second URL that never
      # does, for a CI job or a Dockerfile that wants the installer it was
      # tested against. They are named straight off the checkout above rather
      # than copied into `dist/` first: one argument, and a file that is not
      # there stops the release instead of quietly publishing without it.
      - name: Create release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "${GITHUB_REF_NAME}" dist/* install.sh install.ps1 \
            --verify-tag \
            --title "tasqx ${GITHUB_REF_NAME}" \
            --generate-notes

  # The tap and the bucket hold a rendered copy of what this run just
  # published, and D77 rules how a copy travels: on a branch, through the
  # target repo's own CI, merged only when green. So this job pushes to no
  # main anywhere — it renders both files with the same generators a human
  # would use, opens a PR in each repo, and flips auto-merge on so each PR
  # completes itself when that repo's required checks pass. A failed check
  # leaves an open red PR, which is the loudest available form of "the
  # release and the rendered copy disagree".
  #
  # Needs the PACKAGE_REPOS_TOKEN secret: a fine-grained PAT scoped to
  # homebrew-tasqx and scoop-tasqx with contents and pull-requests
  # read/write — the workflow's own token cannot cross repositories. The job
  # fails loudly, naming the secret, when it is absent.
  #
  # Rehearsable without a tag, unlike the publish job above (a lesson the
  # installer-attachment work paid for): a workflow_dispatch run resolves the
  # newest published release, renders against it, and — the tap and bucket
  # already carrying it — reports "nothing to bump" and exits green. That
  # exercises the token, the clones and the render; only a real tag proves
  # the PR-and-auto-merge half.
  package-managers:
    name: bump tap and bucket
    needs: [build, release]
    if: always() && (needs.release.result == 'success' || (github.event_name == 'workflow_dispatch' && needs.build.result == 'success'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Render both, PR each, auto-merge on green
        env:
          GH_TOKEN: ${{ secrets.PACKAGE_REPOS_TOKEN }}
        run: |
          set -euo pipefail
          if [ -z "${GH_TOKEN}" ]; then
            echo "::error::the PACKAGE_REPOS_TOKEN secret is not set — a fine-grained PAT with contents+pull-requests read/write on dimitritholen/homebrew-tasqx and dimitritholen/scoop-tasqx"
            exit 1
          fi
          TAG="${GITHUB_REF_NAME}"
          if [ "${GITHUB_REF_TYPE}" != "tag" ]; then
            TAG="$(gh release view --repo "${GITHUB_REPOSITORY}" --json tagName --jq .tagName)"
            echo "dispatch rehearsal against the newest release, ${TAG}"
          fi

          bash scripts/brew-formula.sh "$TAG" > /tmp/tasqx.rb
          bash scripts/scoop-manifest.sh "$TAG" > /tmp/tasqx.json

          bump() {
            local repo="$1" rendered="$2" dest="$3"
            git clone --depth 1 \
              "https://x-access-token:${GH_TOKEN}@github.com/dimitritholen/${repo}.git" \
              "/tmp/${repo}"
            ( cd "/tmp/${repo}"
              mkdir -p "$(dirname "$dest")"
              cp "$rendered" "$dest"
              git add -A
              if git diff --cached --quiet; then
                echo "${repo}: already carries ${TAG}, nothing to bump"
                return 0
              fi
              git checkout -b "tasqx-${TAG#v}"
              git -c user.name="github-actions" \
                  -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
                  commit -m "tasqx ${TAG#v}"
              git push origin "tasqx-${TAG#v}"
              gh pr create --repo "dimitritholen/${repo}" \
                --head "tasqx-${TAG#v}" --title "tasqx ${TAG#v}" \
                --body "Rendered by release.yml from the ${TAG} assets. Auto-merges when this repository's checks pass."
              gh pr merge --repo "dimitritholen/${repo}" \
                "tasqx-${TAG#v}" --auto --merge
            )
          }

          bump homebrew-tasqx /tmp/tasqx.rb  Formula/tasqx.rb
          bump scoop-tasqx    /tmp/tasqx.json bucket/tasqx.json
