name: CI

# Every guard in this repo — the drift guards, the executable examples, the
# status-set invariants — only ran when a human typed `cargo test` on one
# machine. That made the whole net advisory. This makes it binding.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # For the mutation sweep below, which is too slow to run per-push.
  schedule:
    - cron: '0 4 * * 1' # Mondays, 04:00 UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three, deliberately. `documented_store_path_matches_the_real_one`
        # is `#[cfg(windows)]`, so the non-Windows store paths in the user guide
        # were never checked by anything; and the daemon's transport differs per
        # platform (Unix socket vs named pipe), which no single-OS run
        # exercises.
        #
        # macOS joined on 2026-08-02, and the reason is a bill this project has
        # already paid. `release.yml` ships FOUR targets, two of them Darwin
        # (`aarch64-apple-darwin`, `x86_64-apple-darwin`) — so half of what
        # users download had never had a single test run against it. That is
        # not hypothetical: the v0.2.0 release run itself exposed a macOS-only
        # daemon bug, where a BSD-derived kernel hands an accepted socket the
        # listener's O_NONBLOCK and Linux does not (daemon.rs, "BSD-derived
        # kernels"). It was found by shipping, which is the most expensive
        # place to find anything.
        #
        # The macOS runner is the priciest of the three, and it is still worth
        # it: the alternative is continuing to publish two binaries whose only
        # test is a user's bug report. Note also that Darwin is not merely
        # "Unix like ubuntu" — the case-insensitive filesystem, the
        # `/var` -> `/private/var` canonicalisation, the 104-byte `sun_path`
        # limit and the absent runtime dir are all real behavioural differences
        # this suite touches.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast is not optional here: cargo stops after the first test
      # BINARY that fails, so a break in tests/engine.rs hides every failure in
      # tests/increment.rs (the largest suite). That turns one red run into a
      # sequence of them, each revealing a failure that was there all along.
      #
      # -D warnings covers RUSTC lints here; clippy is gated in its own job
      # below. It is a gate rather than noise because of a
      # specific failure this repo already had: an editing accident separated a
      # `#[test]` from its function, so a docs drift guard silently stopped
      # running. rustc reported it as `function is never used` and nobody looked.
      # A test that quietly stops running is indistinguishable from a test that
      # passes, so the warning has to be fatal.
      - run: cargo test --workspace --all-targets --no-fail-fast
        env:
          RUSTFLAGS: -D warnings

  # The OS-notification backend is off by default and therefore compiled by
  # nothing in the normal test run — a break in it would surface only on a
  # user's machine, at the moment a reminder fires.
  notify-feature:
    name: build --features notify-os
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo build -p tasqx-core --features notify-os

  # A REAL GATE as of the clippy cleanup. The tree was carrying ~11 findings,
  # which is why this used to be advisory: a job that is always yellow teaches
  # everyone to scroll past it, so it may as well not exist. All of them are now
  # fixed at the source — no `#[allow]` was added to reach zero, so the gate
  # measures the code rather than the suppressions.
  #
  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The rendered docs are a contract too, and until now the only one with no
      # drift guard. Clippy never invokes rustdoc, so `-D warnings` above cannot
      # see a broken intra-doc link: the engine module header pointed at
      # `Engine::begin` for as long as the method has been called
      # `begin_mutation`, and every gate stayed green. rustdoc's link lints are
      # warn-by-default, so RUSTDOCFLAGS is what turns the report into a gate —
      # without it `cargo doc` prints the drift and still exits 0.
      #
      # --all-features, not the default set: `OsNotifier` is behind `notify-os`,
      # so a default-feature doc run compiles none of that module's public
      # surface — the same hole the notify-feature job exists to close for the
      # build. No apt step is needed for it; notify-rust 4 talks D-Bus through
      # zbus (pure Rust), so nothing here links libdbus.
      #
      # --workspace, because the three public doc comments that linked to
      # private items (filter.rs `MAX_NESTING`, config.rs `read_table_in`,
      # lib.rs `Exit::self_framed`) are code spans now. A private item is a fine
      # thing to NAME in public prose and a broken thing to LINK to, since the
      # link resolves for `--document-private-items` and 404s for the readers
      # who get the published page — so the fix is the span, not an allow.
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: line + branch coverage (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-llvm-cov branch instrumentation is currently nightly-only. Keep
      # nightly isolated here; every correctness gate above remains stable.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2.83.4
        with:
          tool: cargo-llvm-cov@0.8.6
          fallback: none
      - uses: Swatinem/rust-cache@v2
      - name: Run instrumented workspace tests
        run: cargo llvm-cov --workspace --all-targets --branch --json --output-path coverage.json
      - name: Render reports
        if: always()
        run: |
          cargo llvm-cov report --branch --html
          cargo llvm-cov report --branch --summary-only | tee coverage-summary.txt
      - name: Publish summary
        if: always()
        run: |
          echo '## Line and branch coverage' >> "$GITHUB_STEP_SUMMARY"
          echo 'Report-only baseline; no aggregate threshold is enforced.' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage-summary.txt ]; then cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"; else echo 'Report generation failed.' >> "$GITHUB_STEP_SUMMARY"; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage-summary.txt
            target/llvm-cov/html/
          if-no-files-found: error

  supply-chain:
    name: advisories + licenses + sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v2.1.1 embeds cargo-deny 0.20.2; both the action and tool are pinned.
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          arguments: --all-features

  # Mutation testing: does the suite NOTICE when the code is wrong?
  #
  # Advisory, NOT a gate — the same reasoning that kept clippy advisory until
  # its findings were cleaned. The
  # scoped sweep currently ends with 5 surviving mutants that have been triaged
  # and deliberately left (two are equivalent mutants no test could ever catch;
  # see docs/mutation-testing.md). A job that is red on its first run trains
  # everyone to ignore it, and `cargo mutants` exits 3 whenever ANY mutant
  # survives — including the equivalent ones.
  #
  # BEFORE THIS BECOMES A GATE — status as of the last local sweep
  # (160 mutants, 143 caught, 0 missed):
  #   1. DONE. Both real gaps the first sweep found are closed and
  #      mutation-verified: the parenthesised-filter precedence inversion
  #      (filter.rs `parse_and`) and the non-strict `due.before`/`due.after`
  #      boundary. Neither was found by review or by 299 passing tests.
  #   2. DONE. The two equivalent mutants are suppressed via `exclude_re` in
  #      .cargo/mutants.toml, each with a justification. `missed` is now 0.
  #   3. NOT DONE, and this is the whole remaining blocker. `cargo mutants`
  #      exits 3 on TIMEOUTS as well as on survivors, and the parser's
  #      `pos += 1` mutants time out by design (they make it loop forever).
  #      Worse, WHICH of them time out varies run to run — three local sweeps
  #      produced 5, 4 and 2 timeouts from identical code, because a mutant
  #      that loses the race is scored caught instead. So the exit code is not
  #      yet a stable signal.
  #
  # Two honest ways forward, neither taken here: give the parser a provable
  # termination bound so those mutants get caught rather than hanging, or
  # accept the timeouts and gate on the parsed `missed` count from
  # mutants.out/outcomes.json instead of on the exit code. Do NOT reach for a
  # blanket `exclude_re` on `pos +=` — that would suppress a real property
  # (loop termination rests entirely on monotonic cursor advance) to buy a
  # green tick.
  # Scheduled weekly + manually dispatchable rather than per-push: the sweep
  # rebuilds and reruns the suite once per mutant (159 of them), which is ~5min
  # on a 24-core dev box and 25-40min on a GitHub runner.
  mutants:
    name: cargo-mutants (advisory)
    runs-on: ubuntu-latest
    # Only on the schedule or a manual click — never on a PR, where a 40-minute
    # advisory job would just delay the checks people actually wait for.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Built from source rather than via a third-party install action: this job
      # is weekly, so the extra minutes cost nothing, and it keeps the release
      # pipeline free of another supply-chain dependency. --locked pins the
      # tool's own lockfile so a broken upstream release cannot turn this red.
      - run: cargo install cargo-mutants --locked
      # No flags: scope, timeouts and cap_lints all come from
      # .cargo/mutants.toml, so this runs exactly what a developer runs locally.
      # Exit 3 means "mutants survived", which is a report, not a failure.
      - run: cargo mutants --jobs 2
      # The report is the deliverable; without it a red run says nothing
      # actionable and the next person has to reproduce it locally.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report
          path: mutants.out/
