name: CI

# Every guard in this repo — the drift guards, the executable examples, the
# status-set invariants — only ran when a human typed `cargo test` on one
# machine. That made the whole net advisory. This makes it binding.
on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:
  # For the mutation sweep below, which is too slow to run per-push.
  schedule:
    - cron: '0 4 * * 1' # Mondays, 04:00 UTC

env:
  CARGO_TERM_COLOR: always

jobs:
  fmt:
    name: rustfmt
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - run: cargo fmt --all -- --check

  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # All three, deliberately. `documented_store_path_matches_the_real_one`
        # exists twice — a `#[cfg(windows)]` and a `#[cfg(unix)]` twin — and the
        # unix one has a `target_os = "macos"` arm asserting
        # `~/Library/Application Support/dev.tasqx.tasqx/tasks.db`. The ubuntu
        # runner takes the Linux branch, so that macOS arm is a documented path
        # no runner had ever executed. The daemon's transport also differs per
        # platform (Unix socket vs named pipe), and BSD kernels differ from Linux
        # on socket flag inheritance — a difference this repo has already been
        # bitten by once, after a release rather than in CI.
        #
        # macOS joined on 2026-08-02, and the reason is a bill this project has
        # already paid. `release.yml` ships FOUR targets, two of them Darwin
        # (`aarch64-apple-darwin`, `x86_64-apple-darwin`) — so half of what
        # users download had never had a single test run against it. That is
        # not hypothetical: the v0.2.0 release run itself exposed a macOS-only
        # daemon bug, where a BSD-derived kernel hands an accepted socket the
        # listener's O_NONBLOCK and Linux does not (daemon.rs, "BSD-derived
        # kernels"). It was found by shipping, which is the most expensive
        # place to find anything.
        #
        # The macOS runner is the priciest of the three, and it is still worth
        # it: the alternative is continuing to publish two binaries whose only
        # test is a user's bug report. Note also that Darwin is not merely
        # "Unix like ubuntu" — the case-insensitive filesystem, the
        # `/var` -> `/private/var` canonicalisation, the 104-byte `sun_path`
        # limit and the absent runtime dir are all real behavioural differences
        # this suite touches.
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # --no-fail-fast is not optional here: cargo stops after the first test
      # BINARY that fails, so a break in tests/engine.rs hides every failure in
      # tests/increment.rs (the largest suite). That turns one red run into a
      # sequence of them, each revealing a failure that was there all along.
      #
      # -D warnings covers RUSTC lints here; clippy is gated in its own job
      # below. It is a gate rather than noise because of a
      # specific failure this repo already had: an editing accident separated a
      # `#[test]` from its function, so a docs drift guard silently stopped
      # running. rustc reported it as `function is never used` and nobody looked.
      # A test that quietly stops running is indistinguishable from a test that
      # passes, so the warning has to be fatal.
      - run: cargo test --workspace --all-targets --no-fail-fast
        env:
          RUSTFLAGS: -D warnings

  # Shell completion, EXECUTED rather than compared against a string.
  #
  # tests/completion.rs is 2400 lines and every line of it about zsh, fish and
  # elvish is a text comparison or an "a registration was emitted" check.
  # Neither proves the activation line works. This repo has the receipt: moving
  # completion off clap's generic `COMPLETE` variable (cf96c81) was a real
  # behavioural change that every text guard passed clean, because a string that
  # matches a string that is also wrong is still a match. Only bash and
  # PowerShell had ever had their line actually run.
  #
  # So this job installs the shells and runs the line the binary prints, then
  # drives the completer it installs against a seeded store — `tasqx li` must
  # offer `list` (static subcommands) and `tasqx done ` must offer a seeded id
  # (the dynamic store lookup, which is the only assertion that proves the
  # completer reaches the store at all).
  #
  # `REQUIRE=zsh,fish` is what stops this degrading quietly: without it a failed
  # `apt-get install` would leave the script reporting "not installed, skipped"
  # and the job would go green having measured nothing — the exact shape of
  # failure this whole job exists to end.
  #
  # elvish IS installed here, deliberately, even though it cannot be driven. It
  # is cheaply installable (it is in the Ubuntu archive), so the honest reason
  # for its absence is not cost: its activation installs
  # `$edit:completion:arg-completer`, and the `edit:` namespace belongs to
  # elvish's interactive line editor, so a non-interactive elvish has nothing to
  # register into — verified, it answers `cannot find variable
  # $edit:completion:arg-completer`. Installing it makes the script say that out
  # loud in the log, so nobody reads this job and assumes elvish is covered.
  #
  # The script is a plain script, not a `#[test]`, so a developer runs exactly
  # what CI runs: `scripts/shell-completion-smoke.sh`. A check only CI can run
  # is one nobody debugs.
  shell-completion:
    name: zsh + fish activation lines (executed)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # The two shells this job exists to prove. Strict: if either is missing
      # the job must go red, and `REQUIRE` below catches it a second time.
      - run: sudo apt-get update && sudo apt-get install -y zsh fish
      # elvish separately and tolerantly. The script cannot drive it — its
      # completer lives in the `edit:` namespace, so there is nothing to invoke
      # from a non-interactive shell — and it is installed only so the log says
      # what elvish's real status is. Making it a hard prerequisite would let a
      # package that contributes one SKIP line redden the whole job.
      - run: sudo apt-get install -y elvish || echo "elvish unavailable; the script will report it as not covered"
      - run: REQUIRE=zsh,fish scripts/shell-completion-smoke.sh

  # The OS-notification backend is off by default and therefore compiled by
  # nothing in the normal test run — a break in it would surface only on a
  # user's machine, at the moment a reminder fires.
  notify-feature:
    name: build --features notify-os
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get update && sudo apt-get install -y libdbus-1-dev pkg-config
      - run: cargo build -p tasqx-core --features notify-os

  # A REAL GATE as of the clippy cleanup. The tree was carrying ~11 findings,
  # which is why this used to be advisory: a job that is always yellow teaches
  # everyone to scroll past it, so it may as well not exist. All of them are now
  # fixed at the source — no `#[allow]` was added to reach zero, so the gate
  # measures the code rather than the suppressions.
  #
  lint:
    name: clippy
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The rendered docs are a contract too, and until now the only one with no
      # drift guard. Clippy never invokes rustdoc, so `-D warnings` above cannot
      # see a broken intra-doc link: the engine module header pointed at
      # `Engine::begin` for as long as the method has been called
      # `begin_mutation`, and every gate stayed green. rustdoc's link lints are
      # warn-by-default, so RUSTDOCFLAGS is what turns the report into a gate —
      # without it `cargo doc` prints the drift and still exits 0.
      #
      # --all-features, not the default set: `OsNotifier` is behind `notify-os`,
      # so a default-feature doc run compiles none of that module's public
      # surface — the same hole the notify-feature job exists to close for the
      # build. No apt step is needed for it; notify-rust 4 talks D-Bus through
      # zbus (pure Rust), so nothing here links libdbus.
      #
      # --workspace, because the three public doc comments that linked to
      # private items (filter.rs `MAX_NESTING`, config.rs `read_table_in`,
      # lib.rs `Exit::self_framed`) are code spans now. A private item is a fine
      # thing to NAME in public prose and a broken thing to LINK to, since the
      # link resolves for `--document-private-items` and 404s for the readers
      # who get the published page — so the fix is the span, not an allow.
      - run: cargo doc --workspace --no-deps --all-features
        env:
          RUSTDOCFLAGS: -D warnings

  coverage:
    name: line + branch coverage (report only)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # cargo-llvm-cov branch instrumentation is currently nightly-only. Keep
      # nightly isolated here; every correctness gate above remains stable.
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: llvm-tools-preview
      - uses: taiki-e/install-action@v2.83.4
        with:
          tool: cargo-llvm-cov@0.8.6
          fallback: none
      - uses: Swatinem/rust-cache@v2
      - name: Run instrumented workspace tests
        run: cargo llvm-cov --workspace --all-targets --branch --json --output-path coverage.json
      - name: Render reports
        if: always()
        run: |
          cargo llvm-cov report --branch --html
          cargo llvm-cov report --branch --summary-only | tee coverage-summary.txt
      - name: Publish summary
        if: always()
        run: |
          echo '## Line and branch coverage' >> "$GITHUB_STEP_SUMMARY"
          echo 'Report-only baseline; no aggregate threshold is enforced.' >> "$GITHUB_STEP_SUMMARY"
          echo '```text' >> "$GITHUB_STEP_SUMMARY"
          if [ -f coverage-summary.txt ]; then cat coverage-summary.txt >> "$GITHUB_STEP_SUMMARY"; else echo 'Report generation failed.' >> "$GITHUB_STEP_SUMMARY"; fi
          echo '```' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: coverage-report
          path: |
            coverage.json
            coverage-summary.txt
            target/llvm-cov/html/
          if-no-files-found: error

  supply-chain:
    name: advisories + licenses + sources
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # v2.1.1 embeds cargo-deny 0.20.2; both the action and tool are pinned.
      - uses: EmbarkStudios/cargo-deny-action@v2.1.1
        with:
          arguments: --all-features

  # Mutation testing: does the suite NOTICE when the code is wrong?
  #
  # Advisory, NOT a gate — the same reasoning that kept clippy advisory until
  # its findings were cleaned. The scoped sweep still ends with survivors, all
  # of them triaged and deliberately left; the note below says how many and
  # which, and docs/mutation-testing.md carries the verdict on each. A job that
  # is red on its first run trains everyone to ignore it, and `cargo mutants`
  # exits 3 whenever ANY mutant survives — including the ones no test could
  # ever kill.
  #
  # BEFORE THIS BECOMES A GATE — the figures below are a DATED READING OF ONE
  # SWEEP, and they must be RE-DERIVED from the newest run every time this
  # block is edited. They are not a standing property of the repository, and
  # treating them as one is exactly how they went wrong: this paragraph read
  # "160 mutants, 143 caught, 0 missed" from an undated local sweep while two
  # consecutive CI sweeps were reporting 203 mutants and a survivor, and the
  # sentence a reader would have acted on — "`missed` is now 0" — was the false
  # one. The total moves whenever `.cargo/mutants.toml`'s scope or the code
  # under it changes, so a snapshot nobody re-reads decays without anybody
  # editing it: the same silently-green failure this job exists to find in the
  # code, in the prose describing it. Re-derive from the summary line
  # `cargo mutants` prints, or from the `mutants-report` artefact uploaded
  # below, and say which run it came from. Paste that line VERBATIM, duration
  # and all: the guards in tasqx-core's lib.rs read the counts off it and check
  # it against the identical line in docs/mutation-testing.md, and they match
  # the shape the tool prints rather than a tidied-up version of it.
  #
  # Last sweep: run 30811736799 on a2f767b (2026-08-03), which matched the
  # scheduled run 30791446542 on ce3f284 that morning count for count — an
  # identical total from two different commits being itself a
  # finding, since it says `examine_globs` covered none of that day's merges
  # (tasqx #50 weighs what to do about the scope).
  #
  #   203 mutants tested in 53m: 1 missed, 184 caught, 14 unviable, 4 timeouts
  #   MISSED crates/tasqx-core/src/filter.rs `spacing_hint`: replace || with && — tasqx #48
  #
  # The survivor is recorded by FUNCTION, not by the `file:line:col` cargo-
  # mutants prints, because `a_surviving_mutant_is_recorded_where_it_still_lives`
  # in tasqx-core's lib.rs resolves that line against the source — and a line
  # number is wrong the next time anything above it moves, which would redden
  # the build on unrelated edits until somebody deleted the guard.
  #
  #   1. DONE. Both real gaps the first sweep found are closed and
  #      mutation-verified: the parenthesised-filter precedence inversion
  #      (filter.rs `parse_and`) and the non-strict `due.before`/`due.after`
  #      boundary. Neither was found by review or by 299 passing tests.
  #   2. DONE AGAIN, but not re-measured. The two equivalent mutants are still
  #      suppressed via `exclude_re` in .cargo/mutants.toml, each with a
  #      justification, so a survivor here still means something real rather
  #      than known noise. `missed` was 1 in the sweep quoted above, and that
  #      survivor is now killed: `spacing_hint` withholds its "did you mean"
  #      advice from any token that opens a predicate of its own, no test paired
  #      a value predicate with a following token that BOTH opens a predicate
  #      and fails to parse, so the guard could weaken to `&&`, never suppress
  #      anything again, and leave the whole suite green while
  #      `project:Home @wroking` started advising a rewrite to
  #      `project:"Home @wroking"`. tasqx #48 closed it with one test per
  #      disjunct — `a_token_opening_a_value_predicate_is_never_hinted_as_a_split_value`
  #      and `a_mistyped_at_keyword_is_never_hinted_as_a_split_value` — each
  #      verified to redden under the `&&` mutation. The count above is left as
  #      the run printed it, because nobody has re-swept since; what makes this
  #      point DONE is the two tests, and only the next sweep can make the
  #      number agree.
  #   3. NOT DONE, and this is the whole remaining blocker. `cargo mutants`
  #      exits 3 on TIMEOUTS as well as on survivors, and the parser's
  #      `pos += 1` mutants time out by design (they make it loop forever).
  #      Worse, WHICH of them time out varies run to run — three local sweeps
  #      produced 5, 4 and 2 timeouts from identical code, because a mutant
  #      that loses the race is scored caught instead. So the exit code is not
  #      yet a stable signal.
  #
  # Two honest ways forward, neither taken here: give the parser a provable
  # termination bound so those mutants get caught rather than hanging, or
  # accept the timeouts and gate on the parsed `missed` count from
  # mutants.out/outcomes.json instead of on the exit code. Do NOT reach for a
  # blanket `exclude_re` on `pos +=` — that would suppress a real property
  # (loop termination rests entirely on monotonic cursor advance) to buy a
  # green tick.
  # Scheduled weekly + manually dispatchable rather than per-push: the sweep
  # rebuilds and reruns the suite once per mutant — the note above says how many
  # there currently are, which is why the count is not repeated here — and that
  # is minutes on a 24-core dev box against the better part of an hour on this
  # runner at `--jobs 2`. The exact wall clock is in the sweep line above, where
  # it is dated; a second copy down here would be the same figure decaying in a
  # place nobody re-derives.
  mutants:
    name: cargo-mutants (advisory)
    runs-on: ubuntu-latest
    # Only on the schedule or a manual click — never on a PR, where a 40-minute
    # advisory job would just delay the checks people actually wait for.
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    continue-on-error: true
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Built from source rather than via a third-party install action: this job
      # is weekly, so the extra minutes cost nothing, and it keeps the release
      # pipeline free of another supply-chain dependency. --locked pins the
      # tool's own lockfile so a broken upstream release cannot turn this red.
      - run: cargo install cargo-mutants --locked
      # No flags: scope, timeouts and cap_lints all come from
      # .cargo/mutants.toml, so this runs exactly what a developer runs locally.
      # Exit 3 means "mutants survived", which is a report, not a failure.
      - run: cargo mutants --jobs 2
      # The report is the deliverable; without it a red run says nothing
      # actionable and the next person has to reproduce it locally.
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mutants-report
          path: mutants.out/

  # The two installers, EXECUTED rather than read.
  #
  # `install.sh` and `install.ps1` are the first code a new user runs, and they
  # are invisible to every gate above: nothing compiles them, so `cargo test`
  # cannot see a break in either. Without this job the cheapest place a broken
  # installer surfaces is a user's terminal, on the one command that has to work
  # before anything else can.
  #
  # THREE RUNNERS, for the reason the test matrix above records at length rather
  # than a new one. `release.yml` ships four targets, two of them Darwin, and the
  # v0.2.0 release exposed a macOS-only daemon bug by shipping it — "the most
  # expensive place to find anything". An installer is per-platform by
  # construction: the Unix half reads a triple out of `uname` and unpacks a
  # tarball, the Windows half reads one out of the processor architecture and
  # unpacks a zip, and Darwin is neither covered by the ubuntu leg nor merely
  # "Unix like ubuntu" — `shasum` instead of `sha256sum` and bash 3.2 are both
  # live differences in the script this job runs.
  #
  # fail-fast: false matches the test job and is load-bearing for the same
  # reason: one broken runner must not hide what the other two would have said,
  # and on a per-platform script the other two are where the answer usually is.
  #
  # No toolchain and no cache: nothing here compiles Rust. This job tests the
  # scripts against a PUBLISHED archive, which is the artefact a user receives.
  installers:
    name: installers (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    # The two forms of one instruction, each written down ONCE and referenced by
    # the steps below. Both used to live inline, and a literal repeated across
    # two steps is how an assertion ends up gating a line that nothing runs: the
    # step that executes drifts, the step that checks does not, and the check
    # stays green about a string it no longer describes.
    env:
      # What README.md documents, `main` and all. README is canonical — this is
      # the copy, and the identity step below asserts in that direction.
      README_ONE_LINER: '[Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12; irm https://raw.githubusercontent.com/dimitritholen/tasqx/main/install.ps1 | iex'
      # What CI runs. Identical to the line above except for the ref, and the ref
      # is the entire reason this is a second string rather than the same one.
      #
      # `main` cannot gate a pull request, in both directions: the URL 404s until
      # the branch merges, so the step reds on the very PR that introduces it,
      # and once merged it fetches main rather than the change under review — so
      # a later edit that breaks install.ps1 would be downloaded from somewhere
      # other than where it broke, and sail past a green tick. $GITHUB_SHA is the
      # commit `actions/checkout` above just checked out, so the script that is
      # fetched and the tree that is tested are the same code. A SHA is also
      # immutable, which a branch ref is not: the CDN has no stale copy to serve.
      #
      # $env:GITHUB_SHA is left literal here and expanded by PowerShell rather
      # than by GitHub, because `irm`'s argument is a bareword and barewords
      # interpolate. Substituting it in YAML would make this a template, and the
      # identity assertion below compares strings.
      CI_ONE_LINER: '[Net.ServicePointManager]::SecurityProtocol=[Net.SecurityProtocolType]::Tls12; irm https://raw.githubusercontent.com/dimitritholen/tasqx/$env:GITHUB_SHA/install.ps1 | iex'
    steps:
      - uses: actions/checkout@v4

      # shellcheck ships on GitHub's ubuntu image. The conditional install is
      # not a formality: if the image ever drops it, the two honest outcomes are
      # "installed it" and "red", and neither of them is a step that silently
      # linted nothing. A linter that skips is indistinguishable from a linter
      # that found nothing, which is the failure shape `REQUIRE=` exists to end
      # further down this same job.
      - name: shellcheck install.sh and the smoke script
        if: runner.os == 'Linux'
        run: |
          command -v shellcheck >/dev/null 2>&1 || {
            sudo apt-get update && sudo apt-get install -y shellcheck
          }
          shellcheck --version
          shellcheck install.sh scripts/installer-smoke.sh

      # `Invoke-ScriptAnalyzer` writes its findings to the pipeline and exits 0
      # whatever it found, so the `if` below is the entire difference between a
      # gate and a report nobody reads. -Severity Error keeps it to defects
      # rather than style, because a linter that is yellow on every run teaches
      # everyone to scroll past it — the same reasoning that kept clippy
      # advisory until its findings were actually cleaned.
      - name: Invoke-ScriptAnalyzer on install.ps1
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          if (-not (Get-Module -ListAvailable -Name PSScriptAnalyzer)) {
            Install-Module PSScriptAnalyzer -Force -Scope CurrentUser -SkipPublisherCheck
          }
          Import-Module PSScriptAnalyzer
          $findings = Invoke-ScriptAnalyzer -Path install.ps1 -Severity Error
          if ($findings) {
            $findings | Format-Table -AutoSize | Out-String | Write-Output
            throw "Invoke-ScriptAnalyzer reported $($findings.Count) Error-severity finding(s) in install.ps1."
          }
          Write-Output 'PSScriptAnalyzer: no Error-severity findings in install.ps1'

      # The four field labels are a CONTRACT between the two installers, not a
      # debugging aid. Both scripts print the same four, so a field renamed on
      # one platform and not the other is caught here instead of by a user
      # comparing two pages of output. Asserting them on all three runners is
      # what makes the two scripts one documented format rather than two that
      # drift apart quietly.
      #
      # Deliberately NOT pinned to a tag: a dry run touches nothing, so it is
      # the one place this job can afford to exercise the `/releases/latest`
      # redirect that scripts/installer-smoke.sh says out loud it does not cover.
      - name: dry run (sh install.sh --dry-run)
        if: runner.os != 'Windows'
        run: |
          out=$(sh install.sh --dry-run 2>&1)
          printf '%s\n' "$out"
          for label in version platform archive 'install to'; do
            printf '%s\n' "$out" | grep -q "^  ${label} " || {
              printf 'no %s line in the dry run above\n' "'$label'" >&2
              exit 1
            }
          done

      - name: dry run (install.ps1 -DryRun)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $out = (& .\install.ps1 -DryRun 2>&1 | Out-String)
          Write-Output $out
          foreach ($label in @('version', 'platform', 'archive', 'install to')) {
            if ($out -notmatch "(?m)^  $label ") {
              throw "no '$label' line in the dry run above"
            }
          }

      # The real thing: download, compare the checksum, unpack, run the binary.
      # The cases live in scripts/installer-smoke.sh rather than inline here, so
      # a developer runs exactly what CI runs — a check only CI can run is one
      # nobody debugs.
      #
      # REQUIRE=curl is what stops this degrading into a green run that measured
      # nothing. Without it, a runner image without curl leaves the script
      # reporting "NOT COVERED" per case and exiting 0, and the job reports
      # success for having skipped everything.
      #
      # The completions case runs with `$SHELL` deliberately unset. If it goes
      # red, the fix is install.sh's skip path — never `SHELL=/bin/bash` in this
      # workflow. Setting it here turns the case green while proving nothing
      # about the container with no procps and no $SHELL that the case exists to
      # reproduce.
      - name: real install, truncated pipe, no hasher, completions (installer-smoke.sh)
        if: runner.os != 'Windows'
        run: REQUIRE=curl scripts/installer-smoke.sh

      # The instruction is the thing under test, so it is checked before it is
      # run, in a step of its own: a drifted one-liner must be reported as a
      # drifted one-liner, not as a download that failed forty lines later.
      #
      # TWO assertions, and neither one covers the other:
      #
      #   1. the documented line is in README.md verbatim, which catches an edit
      #      to the documentation that this workflow was never told about;
      #   2. the line CI runs is that same line with ONLY the ref changed, which
      #      catches the drift in the other direction — a TLS prelude dropped
      #      here, a flag quietly added there. That is why the ref is normalised
      #      out and nothing else is: swapping `main` for a commit is the one
      #      difference this job is entitled to, and every remaining byte has to
      #      match, or CI is proving an invocation no user was ever given.
      - name: the one-liner CI runs is README.md's, modulo the ref
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $documented = $env:README_ONE_LINER
          $executed = $env:CI_ONE_LINER
          if (-not (Select-String -Path README.md -SimpleMatch -Pattern $documented -Quiet)) {
            throw ("README.md no longer contains the documented one-liner verbatim.`n" +
                   "  expected in README.md: $documented`n" +
                   "README is canonical: copy the line out of it into this job's " +
                   "README_ONE_LINER, not the other way round.")
          }
          # Only the ref segment of the raw URL is normalised. The host and the
          # path are deliberately part of the pattern: if either moves, neither
          # string is rewritten, the comparison below fails, and the message
          # names both -- which is the right answer, because a one-liner
          # pointing somewhere else is a different instruction.
          $refPattern = 'raw\.githubusercontent\.com/dimitritholen/tasqx/[^/]+/install\.ps1'
          $refNormal = 'raw.githubusercontent.com/dimitritholen/tasqx/<REF>/install.ps1'
          $a = $documented -replace $refPattern, $refNormal
          $b = $executed -replace $refPattern, $refNormal
          if ($a -ne $b) {
            throw ("the line CI runs differs from the one README.md documents by more than the ref.`n" +
                   "  README.md documents: $documented`n" +
                   "  this job runs      : $executed`n" +
                   "  normalised (README): $a`n" +
                   "  normalised (CI)    : $b`n" +
                   "Only the ref may differ. Everything else, the TLS prelude included, " +
                   "is the instruction a user pastes.")
          }
          Write-Output "README.md documents: $documented"
          Write-Output "this job runs      : $executed"
          Write-Output 'identity (ref normalised): PASS'

      # `shell: powershell` is Windows PowerShell 5.1, NOT pwsh, and that choice
      # is the point of this step rather than an incidental. 5.1 is still the
      # default shell on Windows 11, it is the shell a reader of the README is
      # standing in, and it is where the bare `irm | iex` fails first — on
      # negotiating TLS 1.2, with an error naming neither tasqx nor the cause.
      # Under pwsh this step would prove the script and not the instruction.
      #
      # Only the Windows leg fetches its script over the network, and that
      # asymmetry is deliberate rather than an omission: the Unix steps run the
      # checked-out `install.sh` directly, so they already test the tree under
      # review. `iex` has no equivalent — the instruction IS the download — so
      # here the commit has to be named in the URL for the same guarantee.
      - name: real install (the documented one-liner, fetched at this commit)
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          # PINNED, and not to "latest". This job has to be able to gate the pull
          # request that introduces it, which a dependency on a release cut
          # afterwards makes impossible.
          $env:TASQX_VERSION = 'v0.3.0'
          Write-Output "GITHUB_SHA: $env:GITHUB_SHA"
          Write-Output "running: $env:CI_ONE_LINER"
          Invoke-Expression $env:CI_ONE_LINER

      # A SEPARATE STEP, and that is the whole reason this one exists rather
      # than four more lines above. `install.ps1` ends its success path with
      # `exit 0`, and `iex` runs it IN THIS PROCESS — so an assertion written
      # after the `Invoke-Expression` above is never reached, never fails, and
      # cannot be told apart from an assertion that passed. That was not
      # theory: it was written that way first and found by running it, where
      # the read-back below printed nothing and the step still exited 0. A step
      # boundary is a new process, which is what makes `exit 0` mean "that step
      # finished" instead of "stop measuring".
      #
      # Read back through the ABSOLUTE PATH rather than the name. The installer
      # edits the USER PATH, which is a registry write a step already running
      # does not see, so `tasqx --version` here would be resolving whatever else
      # is on the runner's PATH. "A file arrived" and "the right file arrived,
      # executable, reporting the pinned version" are different claims.
      - name: the binary that one-liner installed answers --version with 0.3.0
        if: runner.os == 'Windows'
        shell: powershell
        run: |
          $exe = Join-Path $env:LOCALAPPDATA 'Programs\tasqx\bin\tasqx.exe'
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "nothing at $exe after an install that reported success"
          }
          $version = (& $exe --version 2>&1 | Out-String).Trim()
          Write-Output "installed binary reports: $version"
          if ($version -notmatch '0\.3\.0') {
            throw "the installed binary reports '$version', which does not name 0.3.0"
          }
